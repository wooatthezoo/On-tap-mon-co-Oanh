<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Tập Hải Dương Học Sinh Địa Hóa - Cô Oanh</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --bg: #f0f9ff;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 16px; }

    /* Header */
    header { background: var(--card-bg); padding: 18px 24px; border-radius: var(--radius); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); text-align: center; }
    h1 { font-size: 1.35rem; color: var(--primary-dark); margin-bottom: 6px; }
    .subtitle { font-size: 0.9rem; color: var(--text-muted); }

    /* Controls Bar */
    .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 12px 16px; border-radius: var(--radius); }
    .filter-select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem; outline: none; background: #fff; cursor: pointer; max-width: 250px; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 8px 14px; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline { background: white; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #f8fafc; }
    .btn-warning { background: #f59e0b; color: white; }
    .btn-warning:hover { background: #d97706; }

    /* Progress & Stats */
    .stats-bar { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    .progress-bar-container { width: 100%; height: 8px; background: #e0f2fe; border-radius: 999px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }

    /* Quiz Card */
    .card { background: var(--card-bg); padding: 24px; border-radius: var(--radius); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); position: relative; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 12px; background: #e0f2fe; color: var(--primary-dark); }
    .question-text { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin-bottom: 20px; color: #1e293b; }

    /* Options */
    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .option-btn { width: 100%; text-align: left; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 10px; background: white; font-size: 0.95rem; line-height: 1.4; color: var(--text); cursor: pointer; transition: all 0.15s ease; }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0f9ff; }
    .option-btn.correct { background: #ecfdf5 !important; border-color: var(--success) !important; color: #065f46 !important; font-weight: 600; }
    .option-btn.wrong { background: #fef2f2 !important; border-color: var(--danger) !important; color: #991b1b !important; }
    .option-btn:disabled { cursor: default; }

    /* Explanation Box */
    .explanation-box { margin-top: 18px; padding: 14px; border-radius: 8px; background: #f8fafc; border-left: 4px solid var(--primary); font-size: 0.9rem; line-height: 1.45; display: none; }
    .explanation-box.show { display: block; }
    .explanation-title { font-weight: 700; margin-bottom: 4px; color: var(--primary-dark); }

    /* Footer Nav */
    .footer-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    
    /* Result Screen */
    .result-screen { text-align: center; padding: 30px 10px; display: none; }
    .score-circle { width: 110px; height: 110px; border-radius: 50%; background: #e0f2fe; color: var(--primary-dark); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 800; margin: 0 auto 16px; border: 4px solid var(--primary); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Hải Dương Học Sinh Địa Hóa</h1>
    <div class="subtitle">Đề cương ôn tập trắc nghiệm - Cô Oanh</div>
  </header>

  <!-- Control panel -->
  <div class="controls">
    <select id="topicFilter" class="filter-select" onchange="changeTopic()">
      <option value="ALL">-- Tất cả các phần --</option>
      <option value="CHƯƠNG 1">Phần 1: Cơ sở chu trình & Cân bằng</option>
      <option value="CHƯƠNG 2">Phần 2: Thành phần & Độ muối</option>
      <option value="CHƯƠNG 3">Phần 3: Tương tác vật chất & Vi sinh</option>
      <option value="CHƯƠNG 4">Phần 4: Đồng vị hải dương</option>
      <option value="DINH DƯỠNG">Phần 5: Chu trình dinh dưỡng (N, P, Si)</option>
      <option value="CARBON">Phần 6: Chu trình Carbon & Các Bơm</option>
      <option value="HỆ CARBONATE">Phần 7: Hệ Carbonate & Acid hóa</option>
      <option value="BÀI TẬP">Phần 8: Bài tập tính toán & Định lượng</option>
    </select>

    <div class="btn-group">
      <button class="btn-outline" onclick="shuffleCurrentList()">🔀 Xáo trộn</button>
      <button id="btnRedoWrong" class="btn-warning" style="display:none;" onclick="startRedoWrong()">⚠️ Luyện câu sai (<span id="wrongCountBadge">0</span>)</button>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="stats-bar">
    <span id="progressText">Câu: 1 / 100</span>
    <span id="scoreText">Đúng: 0 | Sai: 0</span>
  </div>
  <div class="progress-bar-container">
    <div id="progressBar" class="progress-bar-fill"></div>
  </div>

  <!-- Quiz Card -->
  <div class="card" id="quizCard">
    <span id="badgeTopic" class="badge">CHUYÊN ĐỀ</span>
    <div id="questionText" class="question-text">Đang tải câu hỏi...</div>
    <div id="optionsGrid" class="options-grid"></div>

    <div id="explanationBox" class="explanation-box">
      <div class="explanation-title">💡 Giải thích / Ghi nhớ nhanh:</div>
      <div id="explanationText"></div>
    </div>

    <div class="footer-nav">
      <button class="btn-outline" onclick="prevQuestion()" id="btnPrev">← Câu trước</button>
      <button class="btn-primary" onclick="nextQuestion()" id="btnNext">Câu tiếp theo →</button>
    </div>
  </div>

  <!-- Finish screen -->
  <div class="card result-screen" id="resultScreen">
    <div class="score-circle" id="finalScore">100%</div>
    <h2>Hoàn thành bài ôn tập!</h2>
    <p id="resultSummary" style="color: var(--text-muted); margin: 12px 0 20px;">Bạn đã trả lời đúng ... câu.</p>
    <div style="display: flex; gap: 10px; justify-content: center;">
      <button class="btn-primary" onclick="restartQuiz()">🔄 Làm lại từ đầu</button>
      <button id="btnResultRedoWrong" class="btn-warning" onclick="startRedoWrong()">⚠️ Luyện lại các câu sai</button>
    </div>
  </div>
</div>

<script>
// DỮ LIỆU ĐÃ ĐƯỢC CHUẨN HÓA VÀ LỌC FORMAT HOÀN TOÀN
const rawDatabase = [

// BIẾN TRẠNG THÁI TOÀN CỤC
let activeList = [];
let wrongList = [];
let currentIndex = 0;
let userAnswers = {}; // Lưu đáp án người dùng chọn: { index: selectedOptionIndex }
let isRedoMode = false;

// KHỞI ĐỘNG ỨNG DỤNG
function init() {
  activeList = [...rawDatabase];
  userAnswers = {};
  wrongList = [];
  currentIndex = 0;
  isRedoMode = false;
  document.getElementById("btnRedoWrong").style.display = "none";
  loadQuestion();
}

// BỘ LỌC CHỦ ĐỀ
function changeTopic() {
  const selected = document.getElementById("topicFilter").value;
  if (selected === "ALL") {
    activeList = [...rawDatabase];
  } else {
    activeList = rawDatabase.filter(item => item.topic === selected);
  }
  userAnswers = {};
  currentIndex = 0;
  loadQuestion();
}

// XÁO TRỘN CÂU HỎI & ĐÁP ÁN (Fisher-Yates)
function shuffleCurrentList() {
  for (let i = activeList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [activeList[i], activeList[j]] = [activeList[j], activeList[i]];
  }
  userAnswers = {};
  currentIndex = 0;
  loadQuestion();
}

// HIỂN THỊ CÂU HỎI
function loadQuestion() {
  if (activeList.length === 0) return;

  const qData = activeList[currentIndex];
  document.getElementById("quizCard").style.display = "block";
  document.getElementById("resultScreen").style.display = "none";

  // Cập nhật thông tin Header & Badge
  document.getElementById("badgeTopic").innerText = qData.topic || "TRẮC NGHIỆM";
  document.getElementById("questionText").innerText = qData.q;
  
  // Thanh tiến trình
  const total = activeList.length;
  document.getElementById("progressText").innerText = `Câu: ${currentIndex + 1} / ${total}`;
  document.getElementById("progressBar").style.width = `${((currentIndex + 1) / total) * 100}%`;

  // Thống kê đúng/sai hiện tại
  let correctCount = 0;
  let answeredCount = Object.keys(userAnswers).length;
  Object.keys(userAnswers).forEach(idx => {
    if (userAnswers[idx] === activeList[idx].ans) correctCount++;
  });
  document.getElementById("scoreText").innerText = `Đã làm: ${answeredCount} | Đúng: ${correctCount} | Sai: ${answeredCount - correctCount}`;

  // Nút Previous
  document.getElementById("btnPrev").disabled = (currentIndex === 0);

  // Tạo các lựa chọn
  const optionsGrid = document.getElementById("optionsGrid");
  optionsGrid.innerHTML = "";
  const isAnswered = userAnswers.hasOwnProperty(currentIndex);

  qData.options.forEach((optText, optIdx) => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerText = optText;
    btn.onclick = () => selectOption(optIdx);

    if (isAnswered) {
      btn.disabled = true;
      if (optIdx === qData.ans) {
        btn.classList.add("correct");
      }
      if (userAnswers[currentIndex] === optIdx && optIdx !== qData.ans) {
        btn.classList.add("wrong");
      }
    }
    optionsGrid.appendChild(btn);
  });

  // Hộp giải thích
  const expBox = document.getElementById("explanationBox");
  const expText = document.getElementById("explanationText");
  if (isAnswered) {
    expBox.classList.add("show");
    expText.innerText = qData.hint || "Không có giải thích thêm.";
  } else {
    expBox.classList.remove("show");
  }

  // Cập nhật nút luyện câu sai nếu có
  updateWrongBadge();
}

// KHI NGƯỜI DÙNG CHỌN ĐÁP ÁN
function selectOption(selectedIdx) {
  if (userAnswers.hasOwnProperty(currentIndex)) return;

  const currentQ = activeList[currentIndex];
  userAnswers[currentIndex] = selectedIdx;

  // Nếu sai thì thêm vào danh sách câu sai
  if (selectedIdx !== currentQ.ans) {
    if (!wrongList.some(item => item.q === currentQ.q)) {
      wrongList.push(currentQ);
    }
  }

  loadQuestion();
}

function nextQuestion() {
  if (currentIndex < activeList.length - 1) {
    currentIndex++;
    loadQuestion();
  } else {
    showResults();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    loadQuestion();
  }
}

function updateWrongBadge() {
  const badge = document.getElementById("wrongCountBadge");
  const btn = document.getElementById("btnRedoWrong");
  if (wrongList.length > 0) {
    badge.innerText = wrongList.length;
    btn.style.display = "inline-flex";
  } else {
    btn.style.display = "none";
  }
}

// BẬT CHẾ ĐỘ LUYỆN LẠI CÂU SAI
function startRedoWrong() {
  if (wrongList.length === 0) return;
  activeList = [...wrongList];
  wrongList = []; // Reset lại để người dùng làm lại từ đầu
  userAnswers = {};
  currentIndex = 0;
  isRedoMode = true;
  loadQuestion();
}

// MÀN HÌNH TỔNG KẾT
function showResults() {
  document.getElementById("quizCard").style.display = "none";
  const resultScreen = document.getElementById("resultScreen");
  resultScreen.style.display = "block";

  let correctCount = 0;
  activeList.forEach((q, idx) => {
    if (userAnswers[idx] === q.ans) correctCount++;
  });

  const total = activeList.length;
  const pct = Math.round((correctCount / total) * 100);
  document.getElementById("finalScore").innerText = `${pct}%`;
  document.getElementById("resultSummary").innerText = `Bạn đã hoàn thành: Đúng ${correctCount} / ${total} câu hỏi.`;

  const btnRedo = document.getElementById("btnResultRedoWrong");
  if (wrongList.length > 0) {
    btnRedo.style.display = "inline-flex";
    btnRedo.innerText = `⚠️ Luyện lại ${wrongList.length} câu đã làm sai`;
  } else {
    btnRedo.style.display = "none";
  }
}

function restartQuiz() {
  changeTopic();
}

// Chạy khởi tạo
init();
</script>
